<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тесты для производств — База диагностики</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
    }

    /* Единая шапка с главной страницей */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo {
      font-weight: bold;
      color: #2c3e50;
      text-decoration: none;
      font-size: 1.1em;
    }
    nav a {
      color: #0366d6;
      text-decoration: none;
      margin-left: 18px;
      font-size: 0.95em;
    }
    nav a:hover { text-decoration: underline; }

    /* Стили списка тестов (как в вашем исходнике) */
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      font-size: 1.65em;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 20px;
    }
    li { margin-bottom: 15px; }
    li.separator {
      border-top: 2px solid #e53e3e;
      margin: 25px 0;
      padding: 0;
    }
    .test-link {
      display: inline-block;
      padding: 12px 20px;
      background-color: #0366d6;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.2s;
    }
    .test-link:hover { background-color: #024c9e; }
    .btn-primary {
      background-color: #28a745;
      font-weight: bold;
    }
    .btn-primary:hover { background-color: #218838; }

    /* Кнопка возврата снизу */
    .back-box {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }
    .btn-back {
      display: inline-block;
      padding: 10px 16px;
      color: #2c3e50;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95em;
    }
    .btn-back:hover { background-color: #f8fafc; }

    @media (max-width: 640px) {
      nav a { margin-left: 12px; }
      .test-link { display: block; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header>
    <a href="index.html" class="logo">← На главную (Инженерный аудит)</a>
    <nav>
      <a href="index.html#cases">Подход и кейсы</a>
      <a href="index.html#contacts">Контакты</a>
    </nav>
  </header>

  <h1>База тестов для выявления проблем</h1>
  <p>Выберите нужный тест из списка ниже:</p>

  <ul>
    <li>
      <a href="samodiagnostika.html" class="test-link btn-primary">⭐ Тест: Самодиагностика (Главный)</a>
    </li>

    <!-- Красная разделительная черта -->
    <li class="separator"></li>

    <li>
      <a href="shveynoe-atele.html" class="test-link">Тест: Швейное ателье</a>
    </li>
    <li>
      <a href="maslo-iz-semechek.html" class="test-link">Тест: Цех по производству масла из семечек</a>
    </li>
  </ul>

  <div class="back-box">
    <a href="index.html" class="btn-back">← Вернуться на главную страницу</a>
  </div>

</body>
</html>
